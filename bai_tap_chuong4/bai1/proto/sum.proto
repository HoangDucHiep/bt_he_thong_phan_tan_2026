syntax = "proto3";

package sum;
option go_package = "bai1/proto;proto";

service CalculatorService {
  // rpc Add(AddRequest) returns (AddResponse);  // Unary RPC
  rpc AddStream(stream AddRequest) returns (stream AddResponse); // Bidirectional Streaming RPC
}

message AddRequest {
  int32 a = 1;
  int32 b = 2;
}

message AddResponse {
  int32 result = 1;
}